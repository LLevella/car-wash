name: CI/CD

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car-wash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "coverage>=7,<8"

      - name: Check migrations
        working-directory: back
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: back
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        working-directory: back
        run: |
          coverage run --rcfile=../.coveragerc manage.py test --verbosity 2
          coverage report --rcfile=../.coveragerc
          coverage xml --rcfile=../.coveragerc -o ../coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  deploy:
    name: Deploy
    needs: django
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND }}

    steps:
      - name: Check deployment configuration
        id: config
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment is skipped because SSH deployment secrets are not configured."
          fi

      - name: Configure SSH
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then
            if [ -z "$DEPLOY_PATH" ]; then
              echo "Set DEPLOY_PATH or DEPLOY_COMMAND to enable deployment."
              exit 1
            fi

            DEPLOY_COMMAND="cd $DEPLOY_PATH && git pull --ff-only && cd back && python manage.py migrate --noinput"
          fi

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_COMMAND"
