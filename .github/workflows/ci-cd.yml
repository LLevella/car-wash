name: CI/CD

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car-wash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "coverage>=7,<8"

      - name: Check migrations
        working-directory: back
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: back
        run: python manage.py migrate --noinput

      - name: Run deployment checks
        working-directory: back
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-deploy-check-secret-key-for-car-wash-2026-change-in-production"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests with coverage
        working-directory: back
        run: |
          coverage run --rcfile=../.coveragerc manage.py test --verbosity 2
          coverage report --rcfile=../.coveragerc
          coverage xml --rcfile=../.coveragerc -o ../coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run lint
        working-directory: front
        run: npm run lint

      - name: Check formatting
        working-directory: front
        run: npm run format

      - name: Run tests
        working-directory: front
        run: npm test

      - name: Build frontend
        working-directory: front
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front/dist/
          if-no-files-found: error

  deploy:
    name: Deploy
    needs:
      - django
      - frontend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND }}
      DEPLOY_FRONTEND_PATH: ${{ secrets.DEPLOY_FRONTEND_PATH }}

    steps:
      - name: Check deployment configuration
        id: config
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment is skipped because SSH deployment secrets are not configured."
          fi

      - name: Configure SSH
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Download frontend build artifact
        if: ${{ steps.config.outputs.configured == 'true' && env.DEPLOY_FRONTEND_PATH != '' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Upload frontend assets
        if: ${{ steps.config.outputs.configured == 'true' && env.DEPLOY_FRONTEND_PATH != '' }}
        run: |
          tar -C frontend-dist -czf frontend-dist.tar.gz .
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          scp -P "$DEPLOY_PORT" frontend-dist.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/car-wash-frontend-dist.tar.gz"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu; target=$1; mkdir -p "$target"; tar -xzf /tmp/car-wash-frontend-dist.tar.gz -C "$target"; rm /tmp/car-wash-frontend-dist.tar.gz' \
            sh "$DEPLOY_FRONTEND_PATH"

      - name: Deploy over SSH
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then
            if [ -z "$DEPLOY_PATH" ]; then
              echo "Set DEPLOY_PATH or DEPLOY_COMMAND to enable deployment."
              exit 1
            fi

            if [ -n "$DEPLOY_FRONTEND_PATH" ]; then
              DEPLOY_COMMAND="cd $DEPLOY_PATH && git pull --ff-only && cd back && python manage.py migrate --noinput"
            else
              DEPLOY_COMMAND="cd $DEPLOY_PATH && git pull --ff-only && cd front && npm ci && npm run build && cd ../back && python manage.py migrate --noinput"
            fi
          fi

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_COMMAND"
